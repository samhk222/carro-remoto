<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>Controle do Carrinho</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --btn: #2a2e36;
    --btn-active: #ffb020;
    --text: #eef0f3;
    --muted: #8b93a1;
    --ok: #3ccf7a;
    --err: #ff5d5d;
    --accent: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 650; }
  .status { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  .connect {
    width: 100%; max-width: 420px;
    padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #1b1300;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .connect.disconnect { background: var(--btn); color: var(--text); }
  .connect:disabled { opacity: .5; cursor: default; }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: min(100%, 360px);
    aspect-ratio: 1;
  }
  .pad button {
    border: 0; border-radius: 18px;
    background: var(--btn); color: var(--text);
    font-size: 2rem; cursor: pointer;
    touch-action: none;
    transition: background .08s, transform .08s;
  }
  .pad button.active { background: var(--btn-active); color: #1b1300; transform: scale(.96); }
  .pad button.stop { font-size: 1rem; font-weight: 700; background: #3a1f22; color: #ffb3b3; }
  .pad button:disabled { opacity: .35; }
  .up { grid-area: 1 / 2; } .left { grid-area: 2 / 1; } .stop { grid-area: 2 / 2; }
  .right { grid-area: 2 / 3; } .down { grid-area: 3 / 2; }

  .speed { width: 100%; max-width: 420px; background: var(--panel); border-radius: 12px; padding: 14px 16px; }
  .speed label { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: 10px; }
  .speed output { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .info { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  .card small { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
  .dist { font-size: 1.6rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .dist.perto { color: var(--err); } .dist.medio { color: var(--accent); } .dist.livre { color: var(--ok); }
  .auto {
    border: 0; border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--text); font: inherit;
  }
  .auto b { font-size: 1.05rem; }
  .auto.on { background: var(--ok); color: #06210f; }
  .auto.on small { color: #0d3d1d; }
  .auto:disabled { opacity: .4; cursor: default; }

  .hint { max-width: 420px; font-size: .85rem; color: var(--muted); text-align: center; line-height: 1.4; margin: 0; }
  .warn { max-width: 420px; background: #3a2a10; color: #ffd58a; border-radius: 12px; padding: 12px 14px; font-size: .9rem; line-height: 1.4; display: none; }
</style>
</head>
<body>
  <header>
    <h1>🚗 Carrinho</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Desconectado</span></div>
  </header>

  <div class="warn" id="warn">
    Este navegador não suporta Bluetooth pela web. Use o <b>Chrome</b> (Android, Windows, Mac ou Linux).
    No iPhone, use o app <b>Bluefy</b>.
  </div>

  <button class="connect" id="connect">Conectar</button>

  <div class="info">
    <div class="card">
      <small>Distância à frente</small>
      <div class="dist" id="dist">—</div>
    </div>
    <button class="auto" id="auto" disabled>
      <small>Modo automático</small>
      <b id="autoText">Desligado</b>
    </button>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-cmd="F" aria-label="Frente">▲</button>
    <button class="left" data-cmd="L" aria-label="Esquerda">◀</button>
    <button class="stop" data-cmd="S" aria-label="Parar">PARAR</button>
    <button class="right" data-cmd="R" aria-label="Direita">▶</button>
    <button class="down" data-cmd="B" aria-label="Trás">▼</button>
  </div>

  <div class="speed">
    <label for="speed">Velocidade <output id="speedOut">100</output></label>
    <input type="range" id="speed" min="60" max="255" value="100">
  </div>

  <p class="hint" id="hint">Segure um botão para andar e solte para parar. No computador, use as setas do teclado.</p>

<script>
  const SERVICE_UUID = 'b6a1c0de-4f3a-4c8e-9d2a-7c1e5a0f1001';
  const CHAR_UUID    = 'b6a1c0de-4f3a-4c8e-9d2a-7c1e5a0f1002';
  const STATUS_UUID  = 'b6a1c0de-4f3a-4c8e-9d2a-7c1e5a0f1003';
  const REPEAT_MS = 150;
  const HINT_MANUAL = 'Segure um botão para andar e solte para parar. No computador, use as setas do teclado.';
  const HINT_AUTO = 'O carro está dirigindo sozinho: para a menos de 5 cm, vira à direita entre 5 e 10 cm, à esquerda entre 10 e 20 cm e acelera acima disso. Toque em PARAR para voltar ao controle manual.';

  const $ = (id) => document.getElementById(id);
  const connectBtn = $('connect');
  const padButtons = [...document.querySelectorAll('.pad button')];
  const speedInput = $('speed');

  let device = null;
  let characteristic = null;
  let currentCmd = 'S';
  let repeatTimer = null;
  let sending = false;
  let pending = null;
  let autoMode = false;
  const autoBtn = $('auto');

  try {
    const saved = localStorage.getItem('velocidade');
    if (saved) speedInput.value = saved;
  } catch (e) {}
  $('speedOut').textContent = speedInput.value;

  if (!navigator.bluetooth) {
    $('warn').style.display = 'block';
    connectBtn.disabled = true;
  }

  function setConnected(on, label) {
    $('dot').classList.toggle('on', on);
    $('statusText').textContent = label || (on ? 'Conectado' : 'Desconectado');
    connectBtn.textContent = on ? 'Desconectar' : 'Conectar';
    connectBtn.classList.toggle('disconnect', on);
    autoBtn.disabled = !on;
    if (!on) {
      showDistance(null);
      setAutoMode(false);
    }
    updatePad();
  }

  function updatePad() {
    const on = !!characteristic;
    // No modo automático, só o PARAR fica ativo (ele volta para o manual).
    padButtons.forEach((b) => (b.disabled = !on || (autoMode && b.dataset.cmd !== 'S')));
  }

  function setAutoMode(on) {
    autoMode = on;
    autoBtn.classList.toggle('on', on);
    $('autoText').textContent = on ? 'Ligado' : 'Desligado';
    $('hint').textContent = on ? HINT_AUTO : HINT_MANUAL;
    updatePad();
  }

  function showDistance(cm) {
    const el = $('dist');
    el.className = 'dist';
    if (cm === null) { el.textContent = '—'; return; }
    if (cm === 0) { el.textContent = 'livre'; el.classList.add('livre'); return; }
    el.textContent = cm + ' cm';
    el.classList.add(cm < 5 ? 'perto' : cm <= 20 ? 'medio' : 'livre');
  }

  function onStatus(event) {
    const v = event.target.value;
    if (v.byteLength < 3) return;
    showDistance(v.getUint16(0, true));
    const auto = v.getUint8(2) === 1;
    if (auto !== autoMode) setAutoMode(auto);
  }

  setConnected(false);

  // Envia sem sobrepor escritas (o BLE não aceita duas ao mesmo tempo).
  async function send(cmd) {
    if (!characteristic) return;
    pending = new Uint8Array([cmd.charCodeAt(0), Number(speedInput.value)]);
    if (sending) return;
    sending = true;
    while (pending) {
      const data = pending;
      pending = null;
      try {
        if (characteristic.writeValueWithoutResponse) {
          await characteristic.writeValueWithoutResponse(data);
        } else {
          await characteristic.writeValue(data);
        }
      } catch (e) {
        console.warn('Falha ao enviar', e);
      }
    }
    sending = false;
  }

  function start(cmd) {
    if (cmd === 'S') return stop();
    if (autoMode) return;
    currentCmd = cmd;
    padButtons.forEach((b) => b.classList.toggle('active', b.dataset.cmd === cmd));
    send(cmd);
    clearInterval(repeatTimer);
    repeatTimer = setInterval(() => send(currentCmd), REPEAT_MS);
  }

  function stop() {
    currentCmd = 'S';
    clearInterval(repeatTimer);
    repeatTimer = null;
    padButtons.forEach((b) => b.classList.remove('active'));
    if (autoMode) {
      setAutoMode(false);
      send('M');
    } else {
      send('S');
    }
  }

  autoBtn.addEventListener('click', () => {
    if (!characteristic) return;
    if (autoMode) {
      stop();
    } else {
      clearInterval(repeatTimer);
      repeatTimer = null;
      currentCmd = 'S';
      padButtons.forEach((b) => b.classList.remove('active'));
      setAutoMode(true);
      send('A');
    }
  });

  padButtons.forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      start(btn.dataset.cmd);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) =>
      btn.addEventListener(ev, () => { if (currentCmd === btn.dataset.cmd) stop(); })
    );
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  const keys = { ArrowUp: 'F', ArrowDown: 'B', ArrowLeft: 'L', ArrowRight: 'R', w: 'F', s: 'B', a: 'L', d: 'R' };
  document.addEventListener('keydown', (e) => {
    const cmd = keys[e.key];
    if (!cmd || !characteristic) return;
    e.preventDefault();
    if (!e.repeat && cmd !== currentCmd) start(cmd);
  });
  document.addEventListener('keyup', (e) => {
    if (keys[e.key] === currentCmd) stop();
    if (e.key === ' ') stop();
  });

  speedInput.addEventListener('input', () => {
    $('speedOut').textContent = speedInput.value;
    try { localStorage.setItem('velocidade', speedInput.value); } catch (e) {}
    if (autoMode) send('A');
    else if (currentCmd !== 'S') send(currentCmd);
  });

  // Sair da página para o carro no modo manual; o automático continua sozinho.
  document.addEventListener('visibilitychange', () => { if (document.hidden && !autoMode) stop(); });

  function onDisconnected() {
    clearInterval(repeatTimer);
    repeatTimer = null;
    characteristic = null;
    currentCmd = 'S';
    padButtons.forEach((b) => b.classList.remove('active'));
    setConnected(false);
  }

  connectBtn.addEventListener('click', async () => {
    if (device && device.gatt.connected) {
      stop();
      device.gatt.disconnect();
      return;
    }
    try {
      connectBtn.disabled = true;
      $('statusText').textContent = 'Procurando...';
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }, { name: 'Carrinho' }],
        optionalServices: [SERVICE_UUID],
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      $('statusText').textContent = 'Conectando...';
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      characteristic = await service.getCharacteristic(CHAR_UUID);
      try {
        const status = await service.getCharacteristic(STATUS_UUID);
        status.addEventListener('characteristicvaluechanged', onStatus);
        await status.startNotifications();
      } catch (e) {
        console.warn('Firmware sem sensor de distância', e);
      }
      setConnected(true, 'Conectado: ' + (device.name || 'Carrinho'));
    } catch (e) {
      console.warn(e);
      setConnected(false, e.name === 'NotFoundError' ? 'Desconectado' : 'Erro: ' + e.message);
    } finally {
      connectBtn.disabled = !navigator.bluetooth;
    }
  });
</script>
</body>
</html>
